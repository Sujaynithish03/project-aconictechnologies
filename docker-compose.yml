# Local Postgres with the pgvector extension pre-installed.
# Usage: docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: kb-postgres
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: knowledge_base
    ports:
      - "5432:5432"
    volumes:
      - kb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d knowledge_base"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kb_pgdata:
